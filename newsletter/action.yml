name: 'Newsletter'
description: 'Newsletter draft/send automation'
inputs:
  mailchimp_api_key:
    description: Mailchimp API key
    required: true
  mailchimp_list_id:
    description: Mailchimp list ID
    required: true
  mailchmip_segment_id:
    description: Mailchimp segment ID
    required: true
  draft:
    description: Set this to 'false' to send
    required: false
    # not a boolean! ref: https://github.com/actions/runner/issues/1483
    default: 'true'
  ssh_key:
    description: SSH private key used to fetch the repository
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install the Ory CLI
      shell: bash
      run: |
        set -euo pipefail
        version=1.3.1
        archive="ory_${version}-linux_sqlite_64bit.tar.gz"
        checksum=ef416258ed224ebe32e84b04f1b58bff2406eb2032b254d78a7045e808b427a2
        workdir=$(mktemp -d)
        trap 'rm -rf "${workdir}"' EXIT

        curl --fail --silent --show-error --location --retry 7 \
          --output "${workdir}/${archive}" \
          "https://github.com/ory/cli/releases/download/v${version}/${archive}"
        echo "${checksum}  ${workdir}/${archive}" | sha256sum --check --strict
        tar --no-same-owner -xzf "${workdir}/${archive}" -C "${workdir}" ory
        install -m 0755 "${workdir}/ory" ./ory
        ./ory version
    - if: ${{ inputs.ssh_key != '' }}
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        set -euo pipefail
        mkdir -p /home/runner/.ssh
        ssh-keyscan github.com >> /home/runner/.ssh/known_hosts
        echo "${SSH_KEY}" > /home/runner/.ssh/github_actions
        chmod 600 /home/runner/.ssh/github_actions
        ssh-agent -a "$SSH_AUTH_SOCK" > /dev/null
        ssh-add /home/runner/.ssh/github_actions
        git config --global core.sshCommand "ssh -i /home/runner/.ssh/github_actions"
      shell: bash
    - name: Draft or send the newsletter
      env:
        DRAFT: ${{ inputs.draft }}
        MAILCHIMP_LIST_ID: ${{ inputs.mailchimp_list_id }}
        MAILCHIMP_SEGMENT_ID: ${{ inputs.mailchmip_segment_id }}
        MAILCHIMP_API_KEY: ${{ inputs.mailchimp_api_key }}
      run: |
        set -euo pipefail
        if [[ "${DRAFT}" == "false" ]]; then
          # production run
          ./ory dev release notify send "${MAILCHIMP_LIST_ID}"
        elif [[ "${DRAFT}" == "true" ]]; then
          # draft run
          ./ory dev release notify draft --segment "${MAILCHIMP_SEGMENT_ID}" "${MAILCHIMP_LIST_ID}"
          ./ory dev release notify send --dry "${MAILCHIMP_LIST_ID}"
        else
          echo "inputs.draft should be either 'true' or 'false'"
          exit 1
        fi
      shell: bash
