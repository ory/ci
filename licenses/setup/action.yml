name: "Setup license checker"
inputs:
  token:
    description: Personal access token
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2
        token: ${{ inputs.token || github.token }}
    # Install the Go version the repository requires. With a fixed, older
    # version, the go command fetches the required toolchain into the module
    # cache instead, where go-licenses cannot identify standard-library
    # packages and fails with "Package <std> does not have module info".
    - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      if: hashFiles('go.mod') != ''
      with:
        go-version-file: go.mod
    - uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4
      if: hashFiles('go.mod') == ''
      with:
        go-version: "stable"
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.13"
    - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8 # v2
      with:
        node-version: "22"
    - run: sudo apt-get install jq
      shell: bash
    - name: Install license scanner
      run: |
        sh "$GITHUB_ACTION_PATH/../install" \
          --source-dir "$GITHUB_ACTION_PATH/.."
      shell: bash
