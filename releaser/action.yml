name: "Releaser"
description: "Release automation action"
inputs:
  token:
    description: Personal access token
    required: false
    default: ${{ github.token }}
  goreleaser_key:
    description: GoReleaser Pro license key
    required: true
  cosign_pwd:
    description: Password to decrypt signing key
    required: true
  docker_username:
    description: Docker username
    required: true
  docker_password:
    description: Docker password
    required: true

runs:
  using: "composite"
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main@2025-07-31
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        token: ${{ inputs.token }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "24"
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: "1.25"
    - name: Configure the release author
      run: |
        git config --global user.email "60093411+ory-bot@users.noreply.github.com"
        git config --global user.name "ory-bot"
      shell: bash
    - name: Configure Go environment
      run: echo 'GOPATH='"$(go env GOPATH)" >> "$GITHUB_ENV"
      shell: bash
    - name: Prepare release-note paths
      run: |
        set -euo pipefail
        if [[ ! -e package.json ]]; then
          echo '{"private": true, "version": "0.0.0"}' > package.json
          git add package.json
        else
          echo "package.json exists and needs not be written"
        fi

        echo "notes=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_ENV"
      shell: bash
    - name: Checkout changelog renderer
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: ory/changelog
        ref: a084a3aeb57e581ad46f61f14f03889ece64d2f8 # master@2025-10-22
        path: changelog
        persist-credentials: false
    - name: Render release notes
      env:
        CURRENT_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        npm --no-git-tag-version version "$CURRENT_TAG"
        (cd "$GITHUB_WORKSPACE/changelog" && npm ci)
        npx --yes conventional-changelog-cli@2.1.1 \
          --config "changelog/index.js" -r 2 -o "$notes"

        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' '/^# /d' "$notes"
          sed -i '' '/^[[:space:]]*GitOrigin-RevId:/ {N; d;}' "$notes"
        else
          sed -i '/^# /d' "$notes"
          sed -i '/^[[:space:]]*GitOrigin-RevId:/ {N; d;}' "$notes"
        fi

        npx --yes prettier@3.8.2 --write "$notes"
        git reset --hard HEAD
      shell: bash
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
    - name: Build, sign, and publish the release
      env:
        GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
        GORELEASER_KEY: ${{ inputs.goreleaser_key }}
        GITHUB_TOKEN: ${{ inputs.token }}
        COSIGN_PWD: ${{ inputs.cosign_pwd }}
        DOCKER_USERNAME: ${{ inputs.docker_username }}
        DOCKER_PASSWORD: ${{ inputs.docker_password }}
      run: |
        set -euo pipefail
        cat "$notes"
        rm -rf changelog

        docker run --privileged \
          --mount type=bind,source="$(pwd)",target=/project \
          --mount type=bind,source="$notes",target=/notes.md \
          --platform linux/amd64 \
          -e GORELEASER_KEY \
          -e GITHUB_TOKEN \
          -e COSIGN_PWD \
          -e DOCKER_USERNAME \
          -e DOCKER_PASSWORD \
          -e GORELEASER_CURRENT_TAG \
          -v /var/run/docker.sock:/var/run/docker.sock \
          oryd/xgoreleaser:1.26.0-2.14.1@sha256:635fdea1104f933c13298228601ceeda725eb7ce3ed3c1757aae712f44bdd773 \
          release --release-header "/notes.md" --clean --timeout 60m
      shell: bash
    - name: Commit release artifacts
      env:
        ORY_BOT_PAT: ${{ inputs.token }}
      run: |
        git add -A
        git stash || true
        git checkout master || true
        git stash pop || true
        git commit -a -m "autogen: update release artifacts" -m "[skip ci]" || true
        git pull "https://x-access-token:${ORY_BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          master --rebase || true
        if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
          git push "https://x-access-token:${ORY_BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || true
        fi
      shell: bash
    - name: Configure documentation version
      run: |
        docs_version="$(echo "$GITHUB_REF_NAME" | awk -F'.' '{ printf("%s.%s", $1, $2) }')"
        echo "DOCS_VERSION=${docs_version}" >> "$GITHUB_ENV"
      shell: bash
    - name: Run post-release tasks
      id: post_release
      env:
        DOCKER_TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [[ $(git describe --tags) == *"pre"* ]]; then
          echo "This is a pre-release, skipping docs publishing."
          exit 0
        fi

        make post-release
        echo "publish=true" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Commit post-release artifacts
      if: ${{ steps.post_release.outputs.publish == 'true' }}
      env:
        ORY_BOT_PAT: ${{ inputs.token }}
      run: |
        git add -A
        git stash || true
        git checkout master || true
        git pull "https://x-access-token:${ORY_BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          master --ff-only || true
        git stash pop || true
        git commit --allow-empty -a -m "autogen(docs): generate and bump docs" -m "[skip ci]" || true
        git push "https://x-access-token:${ORY_BOT_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
          HEAD:master || true
      shell: bash
