name: Build and publish CLI docs

on:
  workflow_call:
    inputs:
      output-dir:
        description: Directory in ory/docs that receives the generated Markdown.
        required: true
        type: string
      docs-branch:
        description: Branch in ory/docs to update.
        required: false
        default: master
        type: string
      arg:
        description: Optional arguments passed to the CLI documentation generator.
        required: false
        default: ""
        type: string
    secrets:
      token:
        description: Token used only to push the generated documentation.
        required: true

permissions: {}

jobs:
  generate:
    name: Generate CLI docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate output directory
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          [[ "$OUTPUT_DIR" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$OUTPUT_DIR" != /* ]]
          [[ "$OUTPUT_DIR" != -* ]]
          [[ "/$OUTPUT_DIR/" != *"/../"* ]]
          [[ "/$OUTPUT_DIR/" != *"/./"* ]]
          [[ "$OUTPUT_DIR" != *"//"* ]]
      - name: Checkout source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: current-repo
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ory/docs
          ref: ${{ inputs.docs-branch }}
          path: docs
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          check-latest: true
          go-version-file: current-repo/go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Generate CLI docs
        working-directory: current-repo
        env:
          CLI_DOC_ARG: ${{ inputs.arg }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$CLI_DOC_ARG" ]]; then
            read -r -a args <<< "$CLI_DOC_ARG"
          fi
          make .bin/clidoc
          .bin/clidoc "${args[@]}" "../docs/${OUTPUT_DIR}"
      - name: Format generated docs
        working-directory: docs
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          mkdir -p node_modules/ory-prettier-styles
          tarball=$(npm pack ory-prettier-styles@1.3.0 --silent)
          tar -xf "$tarball" -C node_modules/ory-prettier-styles --strip-components=1
          npm install --global prettier@3.2.5
          rm "$tarball"
          npx --no-install prettier --write "$OUTPUT_DIR"
      - name: Validate generated docs
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          generated="docs/${OUTPUT_DIR}"
          if find "$generated" -type l | grep -q .; then
            echo "generated documentation contains symlinks" >&2
            exit 1
          fi
          if find "$generated" -type f ! -name '*.md' | grep -q .; then
            echo "generated documentation contains non-Markdown files" >&2
            exit 1
          fi
          test -n "$(find "$generated" -type f -name '*.md' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-docs
          path: docs/${{ inputs.output-dir }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish CLI docs
    if: ${{ github.ref_name == 'master' || github.ref_type == 'tag' }}
    needs:
      - generate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ory/docs
          ref: ${{ inputs.docs-branch }}
          path: docs
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cli-docs
          path: generated
      - name: Validate generated docs
        env:
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          [[ "$OUTPUT_DIR" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$OUTPUT_DIR" != /* ]]
          [[ "$OUTPUT_DIR" != -* ]]
          [[ "/$OUTPUT_DIR/" != *"/../"* ]]
          [[ "/$OUTPUT_DIR/" != *"/./"* ]]
          [[ "$OUTPUT_DIR" != *"//"* ]]
          if find generated -type l | grep -q .; then
            echo "generated documentation contains symlinks" >&2
            exit 1
          fi
          if find generated -type f ! -name '*.md' | grep -q .; then
            echo "generated documentation contains non-Markdown files" >&2
            exit 1
          fi
          test -n "$(find generated -type f -name '*.md' -print -quit)"
      - name: Commit generated docs
        id: commit
        working-directory: docs
        env:
          DOCS_BRANCH: ${{ inputs.docs-branch }}
          OUTPUT_DIR: ${{ inputs.output-dir }}
        run: |
          set -euo pipefail
          rm -rf -- "$OUTPUT_DIR"
          mkdir -p -- "$OUTPUT_DIR"
          cp -R ../generated/. "$OUTPUT_DIR/"
          if [[ -z "$(git status --porcelain -- "$OUTPUT_DIR")" ]]; then
            echo "Nothing to commit"
            exit 0
          fi

          git config --local user.email "60093411+ory-bot@users.noreply.github.com"
          git config --local user.name "ory-bot"
          git add -- "$OUTPUT_DIR"
          git stash
          git pull --rebase origin "$DOCS_BRANCH"
          git stash apply
          git add -- "$OUTPUT_DIR"
          git commit -m "autogen(docs): generate cli docs"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push generated docs
        if: ${{ steps.commit.outputs.changed == 'true' }}
        working-directory: docs
        env:
          DOCS_BRANCH: ${{ inputs.docs-branch }}
          DOCS_TOKEN: ${{ secrets.token }}
        run: |
          git push "https://x-access-token:${DOCS_TOKEN}@github.com/ory/docs.git" \
            "HEAD:${DOCS_BRANCH}"
